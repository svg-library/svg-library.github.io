<head>
  <title>SVG Library</title>
  <link rel="icon" type="image/svg+xml" href="svg/black_hole.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap" rel="stylesheet">
</head>

<header id="header">SVG Library</header>
<div id="masterContainer">
  <div id="galleryContainer">

    <div class="imageContainer">
      <img src="svg/black_hole.svg">
      <div class="imageTooltip">Black Hole</div>
    </div>
    <div class="imageContainer">
      <img src="svg/black_hole_bw-da.svg">
      <div class="imageTooltip">Black Hole (BW)</div>
    </div>
    <div class="imageContainer">
      <img src="svg/solar_eclipse.svg">
      <div class="imageTooltip">Solar Eclipse</div>
    </div>
    <div class="imageContainer">
      <img src="svg/abstract_bolt.svg">
      <div class="imageTooltip">Abstract Bolt</div>
    </div>
    
  </div>
</div>

<footer id="footer">
  <div>© 2026 EpicAMPlifier. All rights reserved.</div>
  <div>Contributors: EpicAMPlifier, BDA, FSP</div>
</footer>

<style>
  html, body 
  {
    max-width: 100%;
    overflow-x: hidden;
  }

  #header
  {
    display: flex;
    height: 100px; width: 100%;
    background-color: darkslateblue; color: white; 
    font-family: 'Aldrich', sans-serif;
    font-size: 5vw;
    margin-bottom: 20px; text-align: center; justify-content: center; align-items: center;
    padding: 10px;
  }

  #footer
  {
    position: absolute;
    bottom: 0;
    left: 0;
    background-color: black; color: white; 
    height: 100px; width: 100%;
    margin-top: 10px; padding: 10px; 
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
  }
  
  #masterContainer{display: flex; justify-content: center; width: 100%;}

  #galleryContainer
  {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  .imageContainer{position: relative; height: 30vh; width: 30vh; background-color: slategray; padding: 3vw; box-sizing: border-box;}
  .imageContainer img {width: 100%; height: 100%; object-fit: contain; transition: transform 0.3s ease;}
  
  .imageContainer:hover .imageTooltip {visibility: visible; bottom: 0; margin-top: 4vh; opacity: 0.7}
  .imageContainer:hover img {transform: scale(0.8) translateY(-1vh);}

  .imageTooltip 
  {
    position: absolute; display: flex; box-sizing: border-box;
    visibility: hidden; opacity: 0; transition: opacity 0.3s ease, visibility 0.3s allow-discrete;
    padding: 3px; padding-bottom: 5px; margin-top: 0; bottom: 0; left: 0; width: 100%; 
    height: 5vh; line-height: 5vh;
    white-space: nowrap; overflow: hidden;
    background-color: rgb(5, 5, 5); color: white;
    align-items: center; justify-content: center; text-align: center;
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; font-size: 3vh;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const galleryContainer = document.getElementById("galleryContainer");
    galleryContainer.innerHTML = "";

    fetch("./svg-manifest.json")
      .then(response => {
        if (!response.ok) throw new Error("Manifest could not be loaded!");
        return response.json();
      })
      .then(manifestData => {
        Object.entries(manifestData).forEach(([id, metadata]) => {
          const panel = document.createElement("div");
          panel.className = "imageContainer";

          if (metadata["aspect-ratio"]) {
            const ratio = metadata["aspect-ratio"].replace(":", "/");
            panel.style.aspectRatio = ratio;
          }

          const svg = document.createElement("img");
          svg.src = `svg/${metadata.filename}`;
          svg.alt = metadata.name;

          const tooltip = document.createElement("div");
          tooltip.className = "imageTooltip";
          tooltip.textContent = metadata.name;

          panel.appendChild(svg);
          panel.appendChild(tooltip);
          galleryContainer.appendChild(panel);
        })
      })
      .catch(err => {
        console.error("Error building layout!");
        galleryContainer.innerHTML = `<p style="font-family: sans-serif"> Failed to load library.</p>`;
      })
  });
</script>
